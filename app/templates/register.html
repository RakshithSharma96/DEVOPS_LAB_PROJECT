{% extends "base.html" %}
{% block title %}Registration | DevOps Login Lab{% endblock %}
{% block content %}
<h1>Create an account</h1>
<p>Practice form validation. Accounts are not saved.</p>
<form method="post" action="{{ url_for('register') }}" novalidate>
  <label for="full-name">Full name</label>
  <input id="full-name" name="full_name" type="text" autocomplete="name" required value="{{ values.get('full_name', '') }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ values.get('email', '') }}">
  <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
  <input id="password" name="password" type="password" autocomplete="new-password" required>
  <label for="confirm-password">Confirm password</label>
  <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
  <label for="phone">Phone number <span class="hint">(10 digits)</span></label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" required value="{{ values.get('phone', '') }}">
  <label class="checkbox" for="terms">
    <input id="terms" name="terms" type="checkbox" required {% if values.get('terms') == 'on' %}checked{% endif %}>
    I accept the terms and conditions.
  </label>
  <p class="hint">Demo terms: submitted details are validated but never stored.</p>
  <button id="register-button" type="submit">Register</button>
</form>
<nav><a id="back-to-login" href="{{ url_for('login') }}">Back to login</a></nav>
{% endblock %}
