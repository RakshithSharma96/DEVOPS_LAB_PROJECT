<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DevOps Login Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <p class="eyebrow">DEVOPS LAB</p>
    {% block content %}{% endblock %}
    {% if message %}
    <p id="message" role="status" class="message {{ 'success' if success else 'error' }}">{{ message }}</p>
    {% endif %}
  </main>
</body>
</html>
