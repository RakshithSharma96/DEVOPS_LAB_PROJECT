name: devops-login
services:
  app:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-devops-login}-app:local
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  selenium:
    image: selenium/standalone-chrome:4.51.0-20261010
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "localhost", "--port", "4444"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  
  tests:
    image: ${COMPOSE_PROJECT_NAME:-devops-login}-app:local
    profiles: ["testing"]
    environment:
      BASE_URL: "http://${COMPOSE_PROJECT_NAME:-devops-login}-app-1:5000"
      SELENIUM_REMOTE_URL: "http://selenium:4444"
    depends_on:
      app:
        condition: service_healthy
      selenium:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests", "-v", "--junitxml=reports/results.xml"]
